server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 64k;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
