name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: ruff format --check backend
      - run: pip-audit -r backend/requirements.txt
      - run: pytest -q backend
      - run: python -m app.evaluate --output evaluation/demo-report.json
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: demo-evaluation
          path: backend/evaluation/demo-report.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit
        working-directory: frontend
      - run: npm run lint && npm run build
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker/compose.yaml build
      - run: APP_MODE=demo docker compose -f docker/compose.yaml up -d --wait
      - run: |
          curl --fail http://127.0.0.1:5173/
          curl --fail http://127.0.0.1:5173/api/health
          docker compose -f docker/compose.yaml exec -T backend python -c "import os; from pathlib import Path; assert os.getuid() != 0; assert os.access(Path('/app/backend/logs'), os.W_OK)"
      - if: failure()
        run: docker compose -f docker/compose.yaml logs
      - if: always()
        run: docker compose -f docker/compose.yaml down -v
